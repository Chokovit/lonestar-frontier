# Generalized magnet for lathes.
- type: entity
  abstract: true
  id: BaseLatheMagnet
  components:
  - type: MaterialStorageMagnetPickup
    range: 0.30

- type: entity
  parent: DonkcoServiceTechFab
  id: LittleCheesersServiceTechFab
  name: Little Cheeser's service techfab
  description: Prints equipment for Little Cheeser's service staff.
  components:
  - type: Sprite
    sprite: _LoneStar/Structures/Machines/techfab.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: littlecheesers
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: LittleCheesersServiceTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFLightsStatic
    - NFBasicToolsStatic
    - NFBasicStorageStatic
    - NFBasicPartsStatic
    - NFBasicElectronicsStatic
    - NFBasicEvaStatic
    - NFBasicEVAToolsStatic
    - NFMaterialElectronicsStatic
    - NFServiceStorageStatic
    - NFBotanyToolsStatic
    - NFServiceToolsStatic
    - NFServiceEvaPackStatic
    - NFServiceKitchenStatic
    - NFServiceStatic
    - NFPaperAndPaperAccessories
    - ReportingStatic # DeltaV
    - NFLightsColoredStatic
    - NFServiceArchetypeStatic
    - CSPlumbingStatic # Coyote: showers, sinks, drains
    - LittleCheesersServiceTechfabStatic
    - LSFancyLightPack #LS Adds Special bulbs for mood lighting
    - LSAccessibilityPack #LoneStar Adds accessiblity lights to service techfab
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFServiceTechfabEmagStatic
  - type: BlueprintReceiver
    whitelist:
      tags:
      - NFBlueprintServiceTechfab
  - type: OreSiloClient

- type: entity
  id: LittleCheesersBiogenerator
  parent: [ BaseLathe, BaseLatheMagnet ]
  name: pre-programmed biogenerator
  description: The beating heart of every Fast Food chain. The serial number for this one indicates it belongs to a Little Cheeser's.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/biofabricator.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: beaker # Frontier
      map: ["beaker"] # Frontier
      visible: false # Frontier
  - type: Machine
    board: LittleCheesersBiogeneratorMachineCircuitboard
  - type: MaterialStorage
  - type: ProduceMaterialExtractor
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: building
    staticPacks:
    - BioGenLittleCheesersRecipeStatic

  # Frontier: emag lathe recipes, item mapper
  - type: EmagLatheRecipes
    emagStaticPacks:
    - HostileCubesStatic
    - NFBioGenIngredientsDangerous
    - BioGenIngredientsStatic
    - BioGenMaterialsStatic
    - FriendlyCubesStatic # Frontier
    - NFBioGenIngredientsStatic # Frontier
    - NFBioGenMaterialsStatic # Frontier
    - NFBioGenSodaStatic # Frontier
    - NFBioGenSeedsStatic # Frontier
    - NFBioGenSeedsMedicalStatic # Frontier
    - NFBioGenSoil # Frontier
    - NFBioGenAnimalCubesStatic #Frontier
  - type: ItemMapper
    mapLayers:
      beaker:
        whitelist: null # We shouldn't really care what goes in it
    containerWhitelist:
    - beaker_slot
    spriteLayers:
    - beaker
  # End Frontier: emag lathe recipes, item mapper
  # Coyote: Biogenerator Buffer System
  - type: BiogeneratorBuffer
    current: 0
    max: 5000
    regenAmount: 0
    regenInterval: 10
  # End Coyote
  - type: OreSiloClient #LoneStar
