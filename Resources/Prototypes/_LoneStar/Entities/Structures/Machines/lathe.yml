# Generalized magnet for lathes.
- type: entity
  abstract: true
  id: BaseLatheMagnet
  components:
  - type: MaterialStorageMagnetPickup
    range: 0.30

- type: entity
  parent: DonkcoServiceTechFab
  id: LittleCheesersServiceTechFab
  name: Little Cheeser's service techfab
  description: Prints equipment for Little Cheeser's service staff.
  components:
  - type: Sprite
    sprite: _LoneStar/Structures/Machines/techfab.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: littlecheesers
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: LittleCheesersServiceTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFLightsStatic
    - NFBasicToolsStatic
    - NFBasicStorageStatic
    - NFBasicPartsStatic
    - NFBasicElectronicsStatic
    - NFBasicEvaStatic
    - NFBasicEVAToolsStatic
    - NFMaterialElectronicsStatic
    - NFServiceStorageStatic
    - NFBotanyToolsStatic
    - NFServiceToolsStatic
    - NFServiceEvaPackStatic
    - NFServiceKitchenStatic
    - NFServiceStatic
    - NFPaperAndPaperAccessories
    - ReportingStatic # DeltaV
    - NFLightsColoredStatic
    - NFServiceArchetypeStatic
    - CSPlumbingStatic # Coyote: showers, sinks, drains
    - LittleCheesersServiceTechfabStatic
    - LSFancyLightPack #LS Adds Special bulbs for mood lighting
    - LSAccessibilityPack #LoneStar Adds accessiblity lights to service techfab
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFServiceTechfabEmagStatic
  - type: BlueprintReceiver
    whitelist:
      tags:
      - NFBlueprintServiceTechfab
  - type: OreSiloClient
