- type: entity
  name: tomato puree
  parent: FoodBakingBase
  id: FoodTomatoPuree
  description: A puree of tomato sauce, stirred to be thick and spreadable.
  components:
    - type: FlavorProfile
      flavors:
        - tomato
    - type: Sprite
      sprite: _Lonestar/Objects/Consumable/Food/sauce.rsi
      state: tomatopuree
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 10
          reagents:
            - ReagentId: TomatoSauce
              Quantity: 10

- type: entity
  parent: FoodDoughFlat
  id: FoodPizzaBase
  name: pizza base
  description: Flattened dough with tomato sauce spread around it.
  components:
  - type: FlavorProfile
    flavors:
      - dough
      - tomato
  - type: Sprite
    sprite: _Lonestar/Objects/Consumable/Food/ingredients.rsi
    state: dough-pizza
  - type: Construction
    graph: Pizza
    node: pizza-base
