- type: constructionGraph
  id: LSPizza
  start: start
  graph:
    - node: start
      entity: FoodDough
      edges:
        - to: flat
          steps:
            - tool: Rolling
              doAfter: 1
    - node: flat
      entity: FoodDoughFlat
      # Lone Star: Adding Tomato Puree to make a Pizza Base
      edges:
        - to: dough-pizza
          steps:
            - tag: TomatoPuree
              name: construction-graph-tag-tomato-puree
              icon:
                sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
                state: dough-pizza
