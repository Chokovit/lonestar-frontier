- type: constructionGraph
  id: Pizza
  start: start
  graph:
  - node: start
    entity: FoodDough
    edges:
    - to: flat
      steps:
      - tool: Rolling
        doAfter: 1
  - node: flat
    entity: FoodDoughFlat
    # Lone Star: Adding Tomato Puree to make a Pizza Base
    edges:
    - to: pizza-base
      steps:
      - tag: TomatoPuree
        name: construction-graph-tag-tomato-puree
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: dough-pizza
  - node: pizza-base
    entity: FoodPizzaDough
    #Lone Star: Adding Mozzarella to the pizza-dough
    edges:
    - to: pizza-cheese-raw
      steps:
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cheese-raw
  - node: pizza-cheese-raw
    entity: FoodCheesePizzaRaw
    #Lone Star: Adding Mozzarella to the pizza-dough
    edges:
    - to: pizza-pepperoni-raw
      steps:
      - tag: Pepperoni
        name: construction-graph-tag-pepperoni
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw
        doAfter: 3
  - node: pizza-pepperoni-raw
    entity: FoodPepperoniPizzaRaw

    # Frontier: making buttered flat dough
    edges:
    - to: flat-butter
      steps:
      - tag: NFButterStick
        name: construction-graph-tag-nf-butter-stick
        icon:
          sprite: Objects/Consumable/Food/ingredients.rsi
          state: butter
  - node: flat-butter
    entity: FoodDoughFlatButtered
    # Frontier: buttered flat dough -> Pastry dough
    edges:
    - to: pastry
      steps:
      - tool: Rolling
        doAfter: 2 # Lamination takes time
  - node: pastry
    entity: FoodDoughFlatPastry
