- type: constructionGraph
  id: Pizza
  start: start
  graph:
  - node: start
    entity: FoodDough
    edges:
    - to: flat
      steps:
      - tool: Rolling
        doAfter: 1
  - node: flat
    entity: FoodDoughFlat
    edges:
    - to: flat-butter
      steps:
      - tag: NFButterStick
        name: construction-graph-tag-nf-butter-stick
        icon:
          sprite: Objects/Consumable/Food/ingredients.rsi
          state: butter
    - to: pizza-base
      steps:
      - tag: TomatoPuree
        name: construction-graph-tag-tomato-puree
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: dough-pizza
    - to: pizza-base-pesto
      steps:
      - tag: PestoPuree
        name: construction-graph-tag-pesto-puree
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: dough-pesto
    - to: pizza-base-bbq
      steps:
      - tag: BbqPuree
        name: construction-graph-tag-bbq-puree
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: dough-bbq

  # LoneStar: Pizza
  - node: pizza-base
    entity: FoodPizzaDough
    edges:
    - to: pizza-cheese-raw
      steps:
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cheese-raw
  - node: pizza-cheese-raw
    entity: FoodCheesePizzaRaw
    edges:
    - to: pizza-pepperoni-raw
      steps:
      - tag: PepperoniSlice
        amount: 2
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw

    - to: pizza-pineapple-raw
      steps:
      - tag: PineappleSlice
        amount: 2
        name: construction-graph-tag-pineapple-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pineapple-raw
      - tag: RawBacon
        name: construction-graph-tag-bacon
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pineapple-raw

    - to: pizza-meat-raw
      steps:
      - tag: Cutlet
        name: construction-graph-tag-cutlet
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw
      - tag: RawSausage
        name: construction-graph-tag-sausage
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw
      - tag: RawBacon
        name: construction-graph-tag-bacon
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw

    - to: pizza-vegetable-raw
      steps:
      - tag: SlicedVegetable
        amount: 1
        name: construction-graph-tag-sliced-vegetable
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw
      - tag: Chili
        name: construction-graph-tag-chili
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw

    - to: pizza-fourcheese-raw
      steps:
      - tag: CheeseSlice
        name: construction-graph-tag-cheese-wedge
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: ChevreSlice
        name: construction-graph-tag-sliced-chevre
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: CurdCheese
        name: construction-graph-tag-curd-cheese
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw

    - to: pizza-sausage-raw
      steps:
      - tag: RawSausage
        name: construction-graph-tag-sausage
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-sassysage-raw

    - to: pizza-uranium-raw
      steps:
      - material: Uranium
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-uranium-raw
      - tag: Chili
        name: construction-graph-tag-chili
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-uranium-raw
      - tag: Garlic
        name: construction-graph-tag-garlic
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-uranium-raw
      - tag: PepperoniSlice
        amount: 2
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-uranium-raw

    - to: pizza-donkpocket-raw
      steps:
      - tag: DonkPocket
        amount: 2
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-donkpocket-raw

    - to: pizza-mushroom-raw
      steps:
      - tag: Mushroom
        amount: 2
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-mushroom-raw

    - to: pizza-margherita-raw
      steps:
      - tag: TomatoSlice
        amount: 2
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-margherita-raw

    - to: pizza-cotton-raw
      steps:
      - tag: CottonBoll
        amount: 2
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cotton-raw

    - to: pizza-supreme-raw
      steps:
      - tag: OnionSlice
        amount: 1
        name: construction-graph-tag-onion-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw
      - tag: PepperoniSlice
        amount: 1
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw
      - tag: Mushroom
        amount: 1
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw

  - node: pizza-pepperoni-raw
    entity: FoodPepperoniPizzaRaw
  - node: pizza-pineapple-raw
    entity: FoodPineapplePizzaRaw
  - node: pizza-meat-raw
    entity: FoodMeatPizzaRaw
  - node: pizza-vegetable-raw
    entity: FoodVegetablePizzaRaw
  - node: pizza-fourcheese-raw
    entity: FoodFourCheesePizzaRaw
  - node: pizza-sausage-raw
    entity: FoodSausagePizzaRaw
  - node: pizza-uranium-raw
    entity: FoodUraniumPizzaRaw
  - node: pizza-donkpocket-raw
    entity: FoodDonkPocketPizzaRaw
  - node: pizza-mushroom-raw
    entity: FoodMushroomPizzaRaw
  - node: pizza-margherita-raw
    entity: FoodMargheritaPizzaRaw
  - node: pizza-cotton-raw
    entity: FoodCottonPizzaRaw
  - node: pizza-supreme-raw
    entity: FoodSupremePizzaRaw

  # Pesto Pizzas
  - node: pizza-base-pesto
    entity: FoodPestoPizzaDough
    edges:
    - to: pizza-pesto-cheese-raw
      steps:
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cheese-raw
  - node: pizza-pesto-cheese-raw
    entity: FoodPestoCheesePizzaRaw
    edges:
    - to: pizza-pesto-raw
      steps:
      - tag: TomatoSlice
        amount: 1
        name: construction-graph-tag-tomato-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pesto-raw
    - to: pizza-pesto-raw
      steps:
      - tag: Mozzarella
        amount: 1
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pesto-raw

  - node: pizza-pesto-raw
    entity: FoodPestoPizzaRaw

  # BBQ Pizzas
  - node: pizza-base-bbq
    entity: FoodBbqPizzaDough
    edges:
    - to: pizza-bbq-cheese-raw
      steps:
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cheese-raw
  - node: pizza-bbq-cheese-raw
    entity: FoodBbqCheesePizzaRaw
    edges:
    - to: pizza-firecracker-raw
      steps:
      - tag: Chili
        name: construction-graph-tag-chili
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-firecracker-raw
      - tag: CheeseSlice
        name: construction-graph-tag-cheese-wedge
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-firecracker-raw
      - tag: Cutlet
        name: construction-graph-tag-cutlet
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-firecracker-raw
    - to: pizza-chicken-garlic-raw
      steps:
      - tag: ChickenCutlet
        amount: 1
        name: construction-graph-tag-chicken-cutlet
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw
      - tag: Garlic
        name: construction-graph-tag-Garlic
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw

  - node: pizza-firecracker-raw
    entity: FoodFirecrackerPizzaRaw
  - node: pizza-chicken-garlic-raw
    entity: FoodChickenGarlicPizzaRaw

  # Frontier: making buttered flat dough
  - node: flat-butter
    entity: FoodDoughFlatButtered
    edges:
    - to: pastry
      steps:
      - tool: Rolling
        doAfter: 2 # Lamination takes time
  - node: pastry
    entity: FoodDoughFlatPastry
