- type: constructionGraph
  id: Pizza
  start: start
  graph:
  - node: start
    entity: FoodDough
    edges:
    - to: flat
      steps:
      - tool: Rolling
        doAfter: 1
  - node: flat
    entity: FoodDoughFlat
    edges:
    - to: flat-butter
      steps:
      - tag: NFButterStick
        name: construction-graph-tag-nf-butter-stick
        icon:
          sprite: Objects/Consumable/Food/ingredients.rsi
          state: butter
    - to: pizza-base
      steps:
      - tag: TomatoPuree
        name: construction-graph-tag-tomato-puree
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: dough-pizza

  # LoneStar: Pizza
  - node: pizza-base
    entity: FoodPizzaDough
    edges:
    - to: pizza-cheese-raw
      steps:
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-cheese-raw
  - node: pizza-cheese-raw
    entity: FoodCheesePizzaRaw
    edges:
    - to: pizza-pepperoni-raw
      steps:
      - tag: PepperoniSlice
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw
      - tag: PepperoniSlice
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw
      - tag: PepperoniSlice
        name: construction-graph-tag-pepperoni-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pepperoni-raw

    - to: pizza-pineapple-raw
      steps:
      - tag: PineappleSlice
        name: construction-graph-tag-pineapple-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pineapple-raw
      - tag: PineappleSlice
        name: construction-graph-tag-pineapple-slice
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pineapple-raw
      - tag: RawBacon
        name: construction-graph-tag-bacon
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-pineapple-raw

    - to: pizza-meat-raw
      steps:
      - tag: Cutlet
        name: construction-graph-tag-cutlet
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw
      - tag: RawSausage
        name: construction-graph-tag-sausage
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw
      - tag: RawBacon
        name: construction-graph-tag-bacon
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-meat-raw

    - to: pizza-vegetable-raw
      steps:
      - tag: SlicedVegetable
        name: construction-graph-tag-sliced-vegetable
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw
      - tag: SlicedVegetable
        name: construction-graph-tag-sliced-vegetable
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw
      - tag: SlicedVegetable
        name: construction-graph-tag-sliced-vegetable
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw
      - tag: Chili
        name: construction-graph-tag-chili
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-vegetable-raw

    - to: pizza-fourcheese-raw
      steps:
      - tag: CheeseSlice
        name: construction-graph-tag-cheese-wedge
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: ChevreSlice
        name: construction-graph-tag-sliced-chevre
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: ChevreSlice
        name: construction-graph-tag-sliced-chevre
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: Mozzarella
        name: construction-graph-tag-mozzarella
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw
      - tag: CurdCheese
        name: construction-graph-tag-curd-cheese
        icon:
          sprite: _Lonestar/Objects/Consumable/Food/pizzaraw.rsi
          state: pizza-fourcheese-raw

  - node: pizza-pepperoni-raw
    entity: FoodPepperoniPizzaRaw
  - node: pizza-pineapple-raw
    entity: FoodPineapplePizzaRaw
  - node: pizza-meat-raw
    entity: FoodMeatPizzaRaw
  - node: pizza-vegetable-raw
    entity: FoodVegetablePizzaRaw

  # Frontier: making buttered flat dough
  - node: flat-butter
    entity: FoodDoughFlatButtered
    edges:
    - to: pastry
      steps:
      - tool: Rolling
        doAfter: 2 # Lamination takes time
  - node: pastry
    entity: FoodDoughFlatPastry
